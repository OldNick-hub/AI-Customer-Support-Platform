[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-ai-platform"
version = "0.1.0"
description = "Unified Intelligent Customer Support AI Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API & Async Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Persistence & Migrations
    "sqlalchemy[asyncio]>=2.0.32",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",

    # Caching & Distributed Task Queue
    "redis>=5.0.8",
    "celery[redis]>=5.4.0",

    # Vector Storage & Search
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",

    # AI & LLM Inference
    "google-genai>=0.1.1",
    "langchain>=0.2.14",
    "langchain-community>=0.2.12",
    "ollama>=0.3.1",

    # Multimodal, PDF & OCR
    "pillow>=10.4.0",
    "pymupdf>=1.24.9",
    "pytesseract>=0.3.10",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",

    # Security & Cryptography
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "pwdlib[bcrypt]>=0.2.0",
    "bcrypt>=4.1.3",
    "tzdata>=2026.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    # Testing & Verification
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "locust>=2.31.3",
    "aiosqlite>=0.20.0",

    # Static Analysis & Linting
    "ruff>=0.6.1",
    "black>=24.8.0",
    "mypy>=1.11.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

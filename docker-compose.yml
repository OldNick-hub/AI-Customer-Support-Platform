services:
  # --- AUTHORITATIVE PERSISTENCE TIER ---
  postgres:
    image: postgres:16-alpine
    container_name: acsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-customer_support_db}
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_admin} -d ${POSTGRES_DB:-customer_support_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acsp-network

  # --- IN-MEMORY CACHE & MESSAGE BROKER ---
  redis:
    image: redis:7-alpine
    container_name: acsp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acsp-network

  # --- FASTAPI BACKEND API GATEWAY ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acsp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENABLE_BACKGROUND_WORKERS: "false"
      TRUSTED_PROXIES: '["127.0.0.1", "::1", "172.28.0.10"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    networks:
      - acsp-network

  # --- ASYNCHRONOUS BACKGROUND WORKER (DEDICATED INSTANCE PROFILE) ---
  # By default, backend runs all background workers in-process (ENABLE_BACKGROUND_WORKERS=true).
  # For distributed/multi-container scaling, set ENABLE_BACKGROUND_WORKERS=false on backend
  # and enable this dedicated worker with: docker compose --profile dedicated-worker up
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acsp-worker
    restart: unless-stopped
    command: python -m app.worker
    profiles:
      - dedicated-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENABLE_BACKGROUND_WORKERS: "true"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    networks:
      - acsp-network

  # --- FRONTEND (REACT 18 + VITE) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acsp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      acsp-network:
        ipv4_address: 172.28.0.10

  # --- LOCAL INFERENCE FALLBACK (OPTIONAL PROFILE) ---
  ollama:
    image: ollama/ollama:latest
    container_name: acsp-ollama
    restart: unless-stopped
    profiles:
      - ollama-local
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - acsp-network

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  acsp-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
